[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-llm-pipeline"
version = "0.1.0"
description = "面向固定多块输出契约的小模型 SFT 流水线"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]
# 完整安装：pip install -r requirements.txt


[tool.setuptools.packages.find]
where = ["src"]
