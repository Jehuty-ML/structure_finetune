<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title">
  <title id="title">chat_echo --accept 终端示意</title>
  <defs>
    <style>
      .bar { font: 600 12px "Segoe UI", system-ui, sans-serif; fill: #c8cdd5; }
      .mono { font: 500 12px Consolas, "Cascadia Mono", monospace; fill: #d7dde8; }
      .dim { font: 500 12px Consolas, "Cascadia Mono", monospace; fill: #8b93a3; }
      .ok { font: 600 12px Consolas, "Cascadia Mono", monospace; fill: #3dd68c; }
      .cmd { font: 500 12px Consolas, "Cascadia Mono", monospace; fill: #7dd3fc; }
      .usr { font: 500 12px Consolas, "Cascadia Mono", monospace; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="920" height="420" rx="12" fill="#0f1419"/>
  <rect width="920" height="36" rx="12" fill="#1a222c"/>
  <rect y="20" width="920" height="16" fill="#1a222c"/>
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="18" r="5" fill="#27c93f"/>
  <text x="80" y="22" class="bar">scripts/chat_echo.py --accept</text>

  <text x="24" y="64" class="cmd">$ python scripts/chat_echo.py --adapter outputs/echo_lora/... --accept</text>
  <text x="24" y="90" class="dim">加载模型（首次较慢）…</text>
  <text x="24" y="112" class="dim">验收模式：疲惫 / 静音 / 多轮搬家→朋友</text>

  <text x="24" y="144" class="mono">##### 场景 tired</text>
  <text x="24" y="166" class="usr">你&gt; 好累，别让我想太多。</text>
  <text x="24" y="188" class="dim">--- voice (给 App) ---</text>
  <text x="24" y="210" class="mono">{"utter":"没事，我在这儿。你先歇着。","emotion":"gentle","volume":30, …}</text>
  <text x="24" y="232" class="dim">--- 假 TTS (只口播通道) ---</text>
  <text x="24" y="254" class="mono">[TTS] utter=没事，我在这儿… emotion=gentle volume=30</text>
  <text x="24" y="276" class="ok">[tired] OK</text>

  <text x="24" y="308" class="mono">##### 场景 mute</text>
  <text x="24" y="330" class="usr">你&gt; 图书馆模式。</text>
  <text x="24" y="352" class="mono">{"should_speak":false,"ui_mode":"text_only", …}   <tspan class="ok">[mute] OK</tspan></text>

  <text x="24" y="384" class="ok">ACCEPT_PASS：阶段 4 真机对话验收通过</text>
</svg>
