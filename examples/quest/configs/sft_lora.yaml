# Quest SFT（LoRA）
# 数据：手写集（scripts/build_quest_handcrafted.py）；规则卡仍约束 FSM
# 防过拟合：1 epoch、较低 lr；勿把 loss 训到贴地板。

contract: quest
model_source: modelscope
model_name_or_path: "Qwen/Qwen3-1.7B"
model_cache_dir: "models/base"

data_path: "examples/quest/sample_data/train.json"
val_data_path: "examples/quest/sample_data/val.json"
system_prompt_path: "examples/quest/prompts/system_prompt.txt"
schema_path: ""
output_dir: "outputs/quest_lora"

max_seq_length: 2048
load_in_4bit: true
local_files_only: false

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
use_rslora: false
use_dora: false

learning_rate: 2.0e-4
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 1
warmup_steps: 10
logging_steps: 5
eval_strategy: epoch
seed: 3407
packing: false
dataset_num_proc: 1

dry_run: false
