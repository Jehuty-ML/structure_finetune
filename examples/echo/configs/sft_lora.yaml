# Echo SFT（LoRA）— 训练前请填写模型路径
model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"  # 或本地 1.7B/3B/8B 路径
data_path: "examples/echo/sample_data/train_sample.json"
system_prompt_path: "examples/echo/prompts/system_prompt.txt"
output_dir: "outputs/echo_lora"

max_seq_length: 2048
load_in_4bit: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

learning_rate: 2.0e-4
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 3
warmup_steps: 20
logging_steps: 5
seed: 3407

# dry_run=true：仅做契约检查（无需 GPU）。
# 在 src/structured_llm/train 接入 Unsloth/PEFT 后改为 false。
dry_run: true
