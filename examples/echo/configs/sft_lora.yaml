# Echo SFT（LoRA）
# 流程：契约门禁 -> ModelScope 解析基座 -> Unsloth 真训
# 无合格数据不会进入 GPU 训练。默认不访问 HuggingFace。

model_source: modelscope   # modelscope | local | huggingface（不推荐）
model_name_or_path: "Qwen/Qwen3-1.7B"
# model_name_or_path: "Qwen/Qwen3-4B"
# model_name_or_path: "Qwen/Qwen3-8B"
# 已下载的本地目录也可直接写绝对路径，并设 model_source: local
model_cache_dir: "models/base"

data_path: "examples/echo/sample_data/train.json"
val_data_path: "examples/echo/sample_data/val.json"
system_prompt_path: "examples/echo/prompts/system_prompt.txt"
schema_path: "schemas/echo_turn.schema.json"
output_dir: "outputs/echo_lora"

max_seq_length: 2048
load_in_4bit: true
# ModelScope 拉完后会强制本地加载；仅当完全离线且已缓存时设 true
local_files_only: false

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
use_rslora: false
use_dora: false

learning_rate: 2.0e-4
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 1
warmup_steps: 20
logging_steps: 5
# epoch=每个 epoch 末评估；短训不会再被 eval_steps 跳过
eval_strategy: epoch
seed: 3407
packing: false
# Windows 下保持 1，避免 Unsloth tokenize 多进程崩溃
dataset_num_proc: 1

# true=只跑契约门禁；false=门禁通过后启动 Unsloth 真训
dry_run: false
