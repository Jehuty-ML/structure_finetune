# Echo SFT (LoRA) — fill in model paths before training
model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"  # or local path to 1.7B/3B/8B
data_path: "examples/echo/sample_data/train_sample.json"
system_prompt_path: "examples/echo/prompts/system_prompt.txt"
output_dir: "outputs/echo_lora"

max_seq_length: 2048
load_in_4bit: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

learning_rate: 2.0e-4
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 3
warmup_steps: 20
logging_steps: 5
seed: 3407

# dry_run=true: contract-check only (no GPU).
# Set false after wiring Unsloth/PEFT in src/structured_llm/train.
dry_run: true
