name: validate-contracts
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装轻量依赖
        run: pip install -r requirements-min.txt
      - name: 校验 Echo train
        run: python scripts/validate_data.py --data examples/echo/sample_data/train.json
      - name: 校验 Echo val
        run: python scripts/validate_data.py --data examples/echo/sample_data/val.json
      - name: Echo fixture 评测
        run: python scripts/evaluate.py --mode fixture
      - name: 校验 Quest train
        run: python scripts/validate_data.py --contract quest --data examples/quest/sample_data/train.json
      - name: 校验 Quest val
        run: python scripts/validate_data.py --contract quest --data examples/quest/sample_data/val.json
      - name: Quest fixture 评测
        run: python scripts/evaluate.py --contract quest --mode fixture
